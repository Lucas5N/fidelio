<!doctype html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Fidelio</title>

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/css/home.css}" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>
<div class="page">

    <!-- NAVBAR (transparent) -->
    <header class="topnav">
        <div class="nav-inner">
            <!-- Left: logo -->
            <a th:href="@{/}" class="nav-logo">fidelio</a>

            <!-- Center: links -->
            <nav class="nav-center">
                <a class="nav-item" th:href="@{/signin}">Sign in</a>
                <a class="nav-item" th:href="@{/signup}">Create account</a>
                <a class="nav-item" th:href="@{/movies}">Films</a>
                <a class="nav-item" th:href="@{/lists}">Lists</a>
            </nav>

            <!-- Right: search -->
            <form class="nav-search" th:action="@{/search}" method="get" role="search">
                <input
                        class="nav-search-input"
                        type="search"
                        name="q"
                        placeholder="Search films..."
                        autocomplete="off"
                        aria-label="Search films"
                />
                <button class="nav-search-btn" type="submit" aria-label="Search">
                    ⌕
                </button>
            </form>
        </div>
    </header>

    <!-- HERO (with background image) -->
    <section class="hero hero--collage">
        <div class="hero-inner">

            <!-- Hero tagline -->
            <div class="hero-tagline">
                <p>
                    Track what you watch, rate movies, and build lists.<br>
                    <span>All in one place.</span>
                </p>
            </div>

        </div>
    </section>

    <main class="content">
        <!-- Popular -->
        <section class="section">
            <div class="section-head">
                <h2>Popular Films</h2>
            </div>

            <div class="grid">
                <!-- Se hai dati -->
                <a class="card"
                   th:each="film : ${popularFilms}"
                   th:href="@{/movies/{id}(id=${film.tmdbId})}">
                    <div class="card-inner">
                        <div class="poster">
                            <!-- Se hai posterUrl -->
                            <img th:if="${film.posterUrl != null}" th:src="${film.posterUrl}" th:alt="${film.title}" />
                            <div th:if="${film.posterUrl == null}" class="poster-fallback">
                                <span th:text="${film.title}">Film</span>
                            </div>
                        </div>

                        <div class="meta">
                            <div class="title" th:text="${film.title}">Film title</div>
                            <div class="subtitle">
                                <span th:text="${film.year}">2025</span>
                                <span class="dot-sep">•</span>
                                <span th:text="${film.rating}">8.1</span>
                            </div>

                            <div class="genres"
                                 th:if="${film.genres != null && !#lists.isEmpty(film.genres)}"
                                 th:text="${#strings.listJoin(film.genres, ', ')}">
                                Action, Drama
                            </div>

                        </div>
                    </div>
                </a>

                <!-- Fallback placeholder se lista vuota -->
                <div class="card" th:if="${popularFilms == null || #lists.isEmpty(popularFilms)}">
                    <div class="card-inner">
                        <div class="poster-fallback"><span>Film 1</span></div>
                    </div>
                </div>
                <div class="card" th:if="${popularFilms == null || #lists.isEmpty(popularFilms)}">
                    <div class="card-inner">
                        <div class="poster-fallback"><span>Film 2</span></div>
                    </div>
                </div>
                <div class="card" th:if="${popularFilms == null || #lists.isEmpty(popularFilms)}">
                    <div class="card-inner">
                        <div class="poster-fallback"><span>Film 3</span></div>
                    </div>
                </div>
                <div class="card" th:if="${popularFilms == null || #lists.isEmpty(popularFilms)}">
                    <div class="card-inner">
                        <div class="poster-fallback"><span>Film 4</span></div>
                    </div>
                </div>
            </div>
        </section>

        <!-- New Releases -->
        <section class="section">
            <div class="section-head">
                <h2>New Releases</h2>
            </div>

            <div class="grid">
                <a class="card"
                   th:each="film : ${newReleases}"
                   th:href="@{/movies/{id}(id=${film.tmdbId})}">
                    <div class="card-inner">
                        <div class="poster">
                            <img th:if="${film.posterUrl != null}" th:src="${film.posterUrl}" th:alt="${film.title}" />
                            <div th:if="${film.posterUrl == null}" class="poster-fallback">
                                <span th:text="${film.title}">Film</span>
                            </div>
                        </div>

                        <div class="meta">
                            <div class="title" th:text="${film.title}">Film title</div>
                            <div class="subtitle">
                                <span th:text="${film.year}">2025</span>
                                <span class="dot-sep">•</span>
                                <span th:text="${film.rating}">7.8</span>
                            </div>

                            <div class="genres"
                                 th:if="${film.genres != null && !#lists.isEmpty(film.genres)}"
                                 th:text="${#strings.listJoin(film.genres, ', ')}">
                                Action, Drama
                            </div>

                        </div>
                    </div>
                </a>

                <!-- Placeholder se vuota -->
                <div class="card" th:if="${newReleases == null || #lists.isEmpty(newReleases)}">
                    <div class="card-inner">
                        <div class="poster-fallback"><span>Film 1</span></div>
                    </div>
                </div>
                <div class="card" th:if="${newReleases == null || #lists.isEmpty(newReleases)}">
                    <div class="card-inner">
                        <div class="poster-fallback"><span>Film 2</span></div>
                    </div>
                </div>
                <div class="card" th:if="${newReleases == null || #lists.isEmpty(newReleases)}">
                    <div class="card-inner">
                        <div class="poster-fallback"><span>Film 3</span></div>
                    </div>
                </div>
                <div class="card" th:if="${newReleases == null || #lists.isEmpty(newReleases)}">
                    <div class="card-inner">
                        <div class="poster-fallback"><span>Film 4</span></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

</div>

<script th:src="@{/js/home.js}"></script>
</body>
</html>
