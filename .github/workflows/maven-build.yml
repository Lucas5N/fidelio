name: Maven Build and Test  # Nome del workflow

on:  # Quando triggerare
  push:  # Su push a main o altri branch
    branches: [ "master" ]  # Cambia se usi master o altri
  pull_request:  # Su pull request
    branches: [ "master" ]

jobs:  # I job da eseguire
  build:  # Nome del job

    runs-on: ubuntu-latest  # Macchina virtuale (Linux è ok per Java)

    steps:  # Passi sequenziali
    - uses: actions/checkout@v4  # Scarica il codice dal repo

    - name: Set up JDK 17  # Imposta Java 17 (dal tuo progetto)
      uses: actions/setup-java@v4
      with:
        java-version: '17'  # La tua versione
        distribution: 'temurin'  # O adoptojdk, zulu, ecc.
        cache: maven  # Cache per Maven per velocizzare

    - name: Build with Maven  # Esegui build e test
      run: mvn clean install  # O mvn verify se hai integration tests

