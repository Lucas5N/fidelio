<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login - Fidelio</title>
    <link rel="stylesheet" th:href="@{/css/home.css}" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        /* SFONDO SCURO INTEGRATO */
        body.login-page {
            margin: 0;
            padding: 0;
            background: linear-gradient(rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.8)),
            url("/images/collage_movies.jpg") no-repeat center center fixed;
            background-size: cover;
            font-family: 'Inter', sans-serif;
            color: var(--text);
            /* Centratura verticale flessibile */
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            height: auto;
            overflow-y: auto;
        }

        .topnav {
            width: 100%;
            padding: 20px 0;
            flex-shrink: 0;
        }

        .main-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .panel {
            max-width: 420px;
            width: 100%;
            padding: 48px 40px;
            border-radius: var(--radius);
            background: var(--panel);
            box-shadow: var(--shadow);
            border: 1px solid var(--stroke-2);
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .panel h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 32px;
            font-weight: 600; /* Inter 600 */
            letter-spacing: -0.02em;
        }

        /* MESSAGGIO DI ERRORE INLINE */
        #login-error {
            color: #ff4444;
            background: rgba(255, 68, 68, 0.1);
            border-radius: 8px;
            padding: 10px;
            font-size: 13px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
            border: 1px solid rgba(255, 68, 68, 0.3);
        }

        input.error-border { border-color: #ff4444 !important; }

        /* EFFETTO CLICK SUL BOTTONE */
        #loginForm button:active {
            transform: scale(0.98);
        }

        /* SEZIONE REGISTRAZIONE SOTTO ACCEDI */
        .signup-link-section {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
        }

        .signup-link-section p {
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 12px;
        }

        .btn-secondary {
            display: inline-block;
            width: 100%;
            padding: 14px;
            border-radius: var(--radius);
            border: 1px solid var(--stroke-2);
            color: var(--text);
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.2s ease;
            background: rgba(255, 255, 255, 0.03);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--accent);
        }
    </style>
</head>
<body class="login-page">

<header class="topnav">
    <div class="nav-inner">
        <a th:href="@{/}" class="nav-logo nav-logo--img">
            <img src="/images/logo-removebg-preview.png" alt="Fidelio" />
        </a>
    </div>
</header>

<div class="main-wrapper">
    <section class="panel">
        <h1>Accedi</h1>

        <div id="login-error">Email o password errati</div>

        <form id="loginForm">
            <div class="field" style="margin-bottom: 24px;">
                <label style="display: block; margin-bottom: 8px; color: var(--muted); font-size: 14px;">Email</label>
                <input type="email" id="email" required style="width: 100%; height: 52px; padding: 0 18px; border-radius: var(--radius); border: 1px solid var(--stroke-2); background: var(--panel-2); color: var(--text); outline: none;">
            </div>
            <div class="field" style="margin-bottom: 32px;">
                <label style="display: block; margin-bottom: 8px; color: var(--muted); font-size: 14px;">Password</label>
                <input type="password" id="password" required style="width: 100%; height: 52px; padding: 0 18px; border-radius: var(--radius); border: 1px solid var(--stroke-2); background: var(--panel-2); color: var(--text); outline: none;">
            </div>
            <button type="submit" style="width: 100%; height: 56px; background: var(--accent); color: white; border: none; border-radius: var(--radius); font-weight: 600; font-size: 16px; cursor: pointer; transition: transform 0.1s ease;">
                Accedi
            </button>
        </form>

        <div class="signup-link-section">
            <p>Non hai ancora un account?</p>
            <a th:href="@{/signup}" class="btn-secondary">Crea un account ora</a>
        </div>
    </section>
</div>

<script>
    const loginForm = document.getElementById("loginForm");
    const errorMsg = document.getElementById("login-error");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");

    // Rimuove l'errore quando l'utente ricomincia a scrivere
    [emailInput, passwordInput].forEach(input => {
        input.addEventListener('input', () => {
            errorMsg.style.display = "none";
            input.classList.remove("error-border");
        });
    });

    loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        try {
            const response = await fetch("/api/auth/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    email: emailInput.value.trim(),
                    password: passwordInput.value
                })
            });

            if (response.ok) {
                const user = await response.json();
                localStorage.setItem("user", JSON.stringify(user));
                window.location.href = "/home";
            } else {
                // Visualizzazione errore inline
                errorMsg.style.display = "block";
                emailInput.classList.add("error-border");
                passwordInput.classList.add("error-border");
            }
        } catch (err) {
            errorMsg.innerText = "Impossibile collegarsi al server";
            errorMsg.style.display = "block";
        }
    });
</script>
</body>
</html>
