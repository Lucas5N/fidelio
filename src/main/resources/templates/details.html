<!doctype html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${movie.title} + ' • Fidelio'">Movie • Fidelio</title>
    <link rel="stylesheet" th:href="@{/css/movie-details.css}">
</head>

<body>
<!-- HERO with backdrop -->
<section class="movie-hero"
         th:style="${movie.backdropUrl != ''} ? 'background-image: url(' + ${movie.backdropUrl} + ');' : ''">
    <div class="hero-scrim"></div>

    <div class="hero-content">
        <div class="poster-wrap">
            <img class="poster"
                 th:if="${movie.posterUrl != ''}"
                 th:src="${movie.posterUrl}"
                 th:alt="${movie.title}"/>
            <div class="poster-fallback" th:if="${movie.posterUrl == ''}">
                <span th:text="${movie.title}">Poster</span>
            </div>
        </div>

        <div class="meta">
            <div class="title-row">
                <h1 class="title">
                    <span th:text="${movie.title}">Title</span>
                    <span class="year" th:if="${movie.year != ''}" th:text="'(' + ${movie.year} + ')'">(2025)</span>
                </h1>

                <div class="rating-pill" th:if="${movie.rating > 0}">
                    <span class="score" th:text="${#numbers.formatDecimal(movie.rating,1,1)}">8.1</span>
                    <span class="votes" th:text="${movie.votes}">1200</span>
                </div>
            </div>

            <p class="tagline" th:if="${movie.tagline != ''}" th:text="${movie.tagline}">Tagline</p>

            <div class="facts">
                <span th:if="${movie.runtimeLabel != ''}" th:text="${movie.runtimeLabel}">2h 10m</span>
                <span class="dot" th:if="${movie.runtimeLabel != '' && !movie.genres.isEmpty()}">•</span>

                <span class="genres" th:if="${!movie.genres.isEmpty()}">
            <span th:each="g, i : ${movie.genres}">
              <span th:text="${g}">Drama</span><span th:if="${!i.last}">, </span>
            </span>
          </span>
            </div>

            <div class="actions">
                <button class="btn primary" type="button">Log</button>
                <button class="btn" type="button">Watchlist</button>
                <button class="btn" type="button">Like</button>
            </div>

            <div class="overview" th:if="${movie.overview != ''}">
                <h2>Overview</h2>
                <p th:text="${movie.overview}">Overview text...</p>
            </div>

            <div class="crew" th:if="${!movie.directors.isEmpty()}">
                <h3>Director</h3>
                <div class="crew-list">
                    <a class="person-chip"
                       th:each="p : ${movie.directors}"
                       th:href="@{/people/{id}(id=${p.id})}">
                        <span class="name" th:text="${p.name}">Name</span>
                    </a>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- CAST -->
<section class="movie-section" th:if="${!movie.castTop.isEmpty()}">
    <div class="section-head">
        <h2>Cast</h2>
    </div>

    <div class="cast-row">
        <a class="cast-card"
           th:each="p : ${movie.castTop}"
           th:href="@{/people/{id}(id=${p.id})}">
            <div class="avatar">
                <img th:if="${p.profileUrl != ''}" th:src="${p.profileUrl}" th:alt="${p.name}">
                <div class="avatar-fallback" th:if="${p.profileUrl == ''}"></div>
            </div>
            <div class="cast-meta">
                <div class="cast-name" th:text="${p.name}">Actor</div>
                <div class="cast-role" th:text="${p.roleLabel}">Role</div>
            </div>
        </a>
    </div>
</section>

<section class="section reviews-section">
    <div class="section-head reviews-head">
        <h2>Popular Reviews</h2>
    </div>

    <div class="reviews-stack" th:if="${!#lists.isEmpty(popularReviews)}">
        <article class="review-row" th:each="r : ${popularReviews}">
            <header class="review-head">
                <div class="review-user">
                    <div class="avatar avatar--accent" th:text="${r.avatarInitial}">U</div>

                    <div class="user-meta">
                        <div class="user-row">
                            <span class="username" th:text="${r.username}">user</span>
                        </div>
                        <div class="subline">
                            <span class="stars" th:text="${r.starsText}">★★★★★</span>
                            <span class="dot">•</span>
                            <span class="date" th:text="${r.dateLabel}">2026-01-01</span>
                        </div>
                    </div>
                </div>
            </header>

            <div class="review-body">
                <p th:text="${r.contentPreview}">...</p>
            </div>
        </article>
    </div>

    <div class="empty-state" th:if="${#lists.isEmpty(popularReviews)}">
        <p>No popular reviews yet.</p>
    </div>
</section>



</body>
</html>
